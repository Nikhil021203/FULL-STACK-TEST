# Render Blueprint: deploy this repository as one same-origin web service plus PostgreSQL.
# Render creates DATABASE_URL from the database's private connection string automatically.
services:
  - type: web
    name: full-stack-test-drive
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: full-stack-test-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: render

databases:
  - name: full-stack-test-db
    plan: free
    databaseName: full_stack_test
    user: full_stack_test_user
    postgresMajorVersion: "16"
